<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimoHub - Organizations</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>



<div class="container">
    <div class="section-heading">
      <span class="eyebrow">CCS COMMUNITY</span>
      <h1>Find your organization.</h1>
      <p class="muted">Explore College of Computer Studies organizations, events and recruitment opportunities.</p>
    </div>

  <div class="carousel" id="carousel">
    <div id="slides"></div>
      <button class="prev">&#10094;</button>
		<button class="next">&#10095;</button>
    </div>



  <div class='filters'>
    <input type="text" id="search" placeholder="Search organizations..." oninput="render()">
    <select id="categoryFilter" aria-label="Filter by category" onchange="render()">
      <option value="all">All categories</option>
      <option value="Academic">Academic</option>
      <option value="Technology">Technology</option>
      <option value="Community">Community</option>
      <option value="Government">Government</option>
    </select>
    <select id="recFilter" aria-label="Filter by recruitment" onchange="render()">
      <option value="all">All organizations</option>
      <option value="open">Recruiting</option>
			<option value="closed">Not recruiting</option>
    </select>
  </div>

 <div class="row" style="border:none"><h2>Student Organizations</h2><span class="muted" id="resultsCount" aria-live="polite"></span></div>
  <div class="grid" id="orgGrid"></div>
</div>


<div id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/orgs.js"></script> 
</body>
</html>
