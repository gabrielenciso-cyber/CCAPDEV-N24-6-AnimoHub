<!doctype html>
<html lang='en'>
<head>
<meta charset="UTF-8">
<meta name='viewport' content="width=device-width, initial-scale=1.0">
<title>AnimoHub - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="loginpage">
<button id="themeBtn" class="btn outline small themefloat" onclick="toggleTheme()">Dark mode</button>

<div class="authbox">
	<h1>AnimoHub</h1>
  <div class="card">
    <div class="tabs">
      <button id="tabLogin" class="tab active" onclick="showTab('login')">Login</button>
      <button id="tabSignup" class="tab" onclick="showTab('signup')">Sign Up</button>
    </div>

    <form id="loginForm" onsubmit="doLogin(); return false;">
    <div class='field'>
        <label for='liEmail'>DLSU Email</label>
        <input type="email" id='liEmail' placeholder="first_last@dlsu.edu.ph">
      </div>
      <div class="field">
          <label for="liPass">Password</label>
        <input type="password" id="liPass">
      </div>
		<button class="btn" type="submit" style="width:100%">Login</button>
    </form>


    <form id="signupForm" style="display:none" onsubmit="doSignup(); return false;">
      <div class='field'>
          <label for="suName">Full Name</label>
				<input type="text" id="suName">
      </div>
      <div class="field">
        <label for="suEmail">DLSU Email</label>
                <input type="email" id="suEmail" oninput="checkEmail()" placeholder="first_last@dlsu.edu.ph">
        <div class="muted" id="roleHint"></div>
         </div>
      <div class='field'>
        <label for='suPass'>Password</label>
         <input type='password' id='suPass'> 
        </div>
			<div class='field'>
        <label for="suPass2">Confirm Password</label> 
			<input type="password" id='suPass2'> 
      </div>
     <button class="btn" type="submit" style="width:100%">Create Account</button>
   </form>
    </div>

  <div class="card muted"> 
			<b>Demo accounts</b><br>
    Admin: admin@dlsu.edu.ph / admin123<br/>
    President: juan_delacruz@dlsu.edu.ph / pass123<br>
    Officer: maria_santos@dlsu.edu.ph / pass123<br>
    Member: pedro_reyes@dlsu.edu.ph / pass123<br>
    Non-member: ana_lim@dlsu.edu.ph / pass123<br>
    Teacher: jose.rizal@dlsu.edu.ph / pass123
     </div>
</div>


<div id='toasts'></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/login.js"></script>
</body>
</html>
