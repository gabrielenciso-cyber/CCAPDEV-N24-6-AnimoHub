<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimoHub - Profile</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>



<div class="container">
 <h1>Profile</h1>
<div class='tabs'>
        <button class="tab active" id="btn_info" onclick="showTab('info')">Information</button>
    <button class="tab" id="btn_sched" onclick="showTab('sched')">Schedule</button>
		<button class="tab" id="btn_orgs" onclick="showTab('orgs')">My Organizations</button>
	</div>

<div id="infoTab" class="card">
    <div class="field"><label for='pName'>Name</label><input type="text" id="pName"></div>
        <div class='field'><label for="pEmail">Email</label><input type="text" id="pEmail" disabled></div>
    <div class="field"><label for="pRole">Account type</label><input type="text" id="pRole" disabled></div>
		<button class="btn" onclick="saveProfile()">Save changes</button>
  </div>


<div id="schedTab" class="card" style="display:none">
    <h3>Weekly schedule</h3> 
      <div id="schedBox"></div>
 </div>


  <div id="orgsTab" class="card" style="display:none">
		<h3>My organizations</h3>
    <div id="myOrgs"></div>
  </div>
</div>

<div id='toasts'></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
