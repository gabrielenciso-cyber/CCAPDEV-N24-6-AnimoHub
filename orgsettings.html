<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content='width=device-width, initial-scale=1.0'>
<title>AnimoHub - Organization Settings</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>



<div class="container">
  <h1>Organization Settings</h1>

  <div class='card'>
    <div class="field">
			<label for="orgSelect">Organization</label>
			<select id="orgSelect" onchange="changeOrg()"></select>
    </div>
      <span class="badge officer" id="roleText"></span>
</div>

  <div class="card">
		<h3>Organization info</h3>
        <div class="field">
			<label for="infoDesc">Description</label>
      <textarea id="infoDesc" rows="3"></textarea>
      </div>
   <div class="field">
        <label for="infoColor">Theme color</label>
      <input type="color" id="infoColor">
   </div>
		<div class="field">
      <label><input type="checkbox" id="infoRecruit"> Open for member applications</label>
    </div>
    <div class="field">
      <label><input type="checkbox" id="infoHiring"> Open officer hiring</label>
      </div>
    <button class="btn" onclick="saveInfo()">Save</button>
	</div>


  <div class="twocol">
    <div class='card'>
        <h3>Events</h3>
        <input type="hidden" id="evId">
      <div class="field"><label for='evTitle'>Title</label><input type="text" id="evTitle"></div>
      <div class="field"><label for="evDate">Date</label><input type="date" id="evDate"></div>
        <div class='field'><label for='evPlace'>Place</label><input type="text" id="evPlace"></div>
        <button class="btn" id="evBtn" onclick="saveEvent()">Add Event</button>
      <button class="btn outline" onclick="clearEvForm()">Clear</button>
     <div id="evList"></div>
         </div>


      <div>
      <div class="card">
        <h3>Applications</h3>
        <div id="appList"></div>
      </div>
			<div class='card'>
         <h3>Resignation forms</h3>
        <div id="resList"></div>
			</div>
      </div>
  </div>


 <div class='card'>
		<h3>Members</h3>
        <div class="tablewrap">
      <table>
        <tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr>
       <tbody id='memBody'></tbody>
      </table>
  </div>
	</div>
</div>

<div id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/orgsettings.js"></script>
</body>
</html>
