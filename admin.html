<!doctype html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content='width=device-width, initial-scale=1.0'>
<title>AnimoHub - Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>

<div class="container">
  <h1>Admin</h1>

 <div class="card">
  <div class="row" style="border:none">
      <h3 style="margin:0">Organizations</h3>
			<button class="btn small" onclick="newOrg()">+ Add Organization</button>
    </div>
    <div class="tablewrap">
     <table>
        <tr><th>Name</th><th>President</th><th>Members</th><th></th></tr>
        <tbody id="orgRows"></tbody>
      </table>
        </div>
  </div>

	<div class="card">
   <h3>Create admin account</h3>
    <div class="twocol">
      <div class="field"><label for='aName'>Name</label><input type="text" id="aName"></div>
      <div class="field"><label for="aEmail">Email</label><input type="email" id="aEmail"></div>
      </div>
    <div class="field"><label for='aPass'>Password</label><input type="password" id="aPass"></div>
    <button class="btn" onclick="createAdmin()">Create</button>
	</div>
</div>

<div class="modal" id="orgModal">
	<div class="modalbox">
      <h3 id="orgFormTitle">Organization</h3>
    <input type='hidden' id='oId'>
        <div class="field"><label for="oName">Name</label><input type="text" id='oName'></div>
    <div class="field"><label for="oDesc">Description</label><textarea id="oDesc" rows="3"></textarea></div>
    <div class="field"><label for="oPres">President email</label><input type="email" id="oPres" placeholder="first_last@dlsu.edu.ph"></div>
    <div class="modalbtns">
      <button class="btn outline" onclick="closeModal('orgModal')">Cancel</button>
      <button class="btn" onclick="saveOrgForm()">Save</button>
		</div>
  </div>
</div>


<div id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body> 
</html>
