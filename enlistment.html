<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimoHub - Enlistment</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id='navbar'></div>

<div class="container">
    <h1>Enlistment</h1>
	<div class="tabs">
    <a class="tab active" href="enlistment.html">My Enlistment</a>
        <a class="tab" href="courses.html">Course Offerings</a>
	</div>

	<div class="card">
      <h3>Enlist a course</h3>
   <div class="twocol">
      <div class="field">
        <label for="courseSel">Course</label>
        <select id="courseSel" onchange="fillSections()"></select>
      </div>
			<div class="field">
        <label for='secSel'>Section</label>
				<select id="secSel"></select>
     </div>
    </div>
    <button class="btn" onclick="addCourse()">Enlist</button>
    <a class="btn outline" href='courses.html'>Browse course offerings</a>
  </div>

  <div class="card">
    <div class="row" style="border:none">
      <h3 style='margin:0'>My enlisted courses</h3>
      <span class='badge ok' id="unitsText"></span>
    </div>
            <div class="tablewrap"> 
                <table>
        <tr><th>Code</th><th>Course</th><th>Section</th><th>Schedule</th><th>Units</th><th></th></tr>
        <tbody id="enlistBody"></tbody>
        </table>
    </div> 
    </div>
</div>

<div id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/enlistment.js"></script>
</body>
</html>
