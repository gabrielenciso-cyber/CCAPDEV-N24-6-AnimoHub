<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimoHub - Course Offerings</title>
<link rel="stylesheet" href='css/style.css'>
</head>
<body>
<div id="navbar"></div>

<div class="container">
  <h1>Course Offerings</h1>
  <div class="tabs" id="subtabs">
   <a class="tab" href='enlistment.html'>My Enlistment</a>
    <a class="tab active" href="courses.html">Course Offerings</a>
</div>




	<div class='filters'>
       <input type="text" id="search" placeholder="Search course code, name or professor..." oninput="render()">
      <select id="modeFilter" onchange="render()">
       <option value="all">All modes</option>
      <option value="Online">Online</option>
      <option value="Onsite">Onsite</option>
  </select>
		<select id="availFilter" onchange="render()">
      <option value="all">All sections</option>
       <option value="open">Has slots</option>
			<option value="full">Full</option>
   </select>
	</div>


  <div class='row' style="border:none">
    <span class="muted" id="lastUpdate"></span>
    <button class="btn small outline" onclick="render()">Refresh</button>
	</div>


  <div id="courseList"></div>
</div>
 
<div id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/courses.js"></script>
</body>
</html>
