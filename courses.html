<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AnimoHub - Course Offerings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="navbar"></div>

    <main class="container">
      <!-- Top Title & Navigation -->
      <header class="page-header">
        <div>
          <h1>Course Offerings</h1>
          <p class="muted">Browse available subjects, schedules, and slots.</p>
        </div>
        <div class="header-actions">
          <span class="muted" id="lastUpdate"></span>
          <button
            class="btn small outline"
            onclick="render()"
            title="Refresh offerings"
          >
            ↻ Refresh
          </button>
        </div>
      </header>

      <!-- Sub Navigation Tabs -->
      <nav class="tabs" id="subtabs">
        <a class="tab" href="enlistment.html">My Enlistment</a>
        <a class="tab active" href="courses.html">Course Offerings</a>
      </nav>

      <!-- Minimal Search & Filter Toolbar -->
      <section class="filter-card">
        <div class="search-wrap">
          <input
            type="text"
            id="search"
            placeholder="Search by code, title, or instructor..."
            oninput="render()"
          />
        </div>
        <div class="filter-selects">
          <select id="modeFilter" onchange="render()">
            <option value="all">All Modes</option>
            <option value="Online">Online</option>
            <option value="Onsite">Onsite</option>
          </select>

          <select id="availFilter" onchange="render()">
            <option value="all">All Status</option>
            <option value="open">Available Slots</option>
            <option value="full">Full / Closed</option>
          </select>
        </div>
      </section>

      <!-- Dynamic Course Content -->
      <div id="courseList"></div>
    </main>

    <div id="toasts"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/courses.js"></script>
  </body>
</html>
